<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>GlobeTrotter — Plan your next adventure</title>
    <meta
      name="description"
      content="Plan multi-city trips, build day-by-day itineraries, track your budget automatically and share your route with friends."
    />

    <!-- Matches the light/dark background tokens so the browser chrome and the
         status bar blend into the app instead of flashing white. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8fafc" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f172a" />
    <meta name="color-scheme" content="light dark" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <script>
      // Applies the saved theme before first paint, so a dark-mode user never
      // sees a white flash while React boots.
      (function () {
        try {
          var stored = localStorage.getItem('globetrotter-theme');
          var dark =
            stored === 'dark' ||
            (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {
          /* localStorage unavailable — fall back to the light default */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
